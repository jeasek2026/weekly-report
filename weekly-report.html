<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<title>工作周报工具</title>
<style>
  :root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --primary-light:#eef2ff;
    --accent:#06b6d4;
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --text-light:#6b7280;
    --border:#e5e7eb;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --shadow-lg:0 10px 25px rgba(0,0,0,.1);
    --radius:14px;
    --radius-sm:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  /* ===== 锁屏 ===== */
  #lockScreen{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(145deg,#4f46e5 0%,#7c3aed 50%,#06b6d4 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;color:#fff;
  }
  .lock-logo{
    width:84px;height:84px;border-radius:24px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;margin-bottom:16px;
    border:1px solid rgba(255,255,255,.2);
  }
  .lock-title{font-size:22px;font-weight:700;margin-bottom:6px}
  .lock-sub{font-size:13px;opacity:.8;margin-bottom:30px}
  .lock-toggle{font-size:13px;opacity:.85;margin-top:24px;cursor:pointer;text-decoration:underline}
  /* 密码输入 */
  .pwd-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:280px}
  .pwd-input{
    width:100%;padding:14px 18px;border-radius:var(--radius);
    border:none;background:rgba(255,255,255,.18);color:#fff;
    font-size:18px;text-align:center;letter-spacing:8px;
    backdrop-filter:blur(10px);outline:none;
  }
  .pwd-input::placeholder{color:rgba(255,255,255,.6);letter-spacing:1px}
  .btn-unlock{
    width:100%;padding:14px;border-radius:var(--radius);border:none;
    background:#fff;color:var(--primary);font-size:16px;font-weight:600;cursor:pointer;
    transition:transform .1s;
  }
  .btn-unlock:active{transform:scale(.97)}
  /* 手势解锁 */
  #gestureCanvas{
    background:rgba(255,255,255,.08);
    border-radius:20px;border:1px solid rgba(255,255,255,.15);
    touch-action:none;cursor:pointer;
  }
  .gesture-hint{font-size:13px;opacity:.85;margin-top:14px;min-height:18px}

  /* ===== 主应用 ===== */
  #app{display:none;min-height:100vh;padding-bottom:80px}
  .app-header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;padding:18px 16px 16px;
    position:sticky;top:0;z-index:20;
    box-shadow:var(--shadow);
  }
  .app-header .top-row{display:flex;align-items:center;justify-content:space-between}
  .app-header h1{font-size:18px;font-weight:600}
  .header-actions{display:flex;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:none;
    background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:rgba(255,255,255,.3)}
  .header-tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .header-tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:7px 14px;border-radius:20px;font-size:13px;white-space:nowrap;
    background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:none;cursor:pointer;
    transition:.2s;
  }
  .tab.active{background:#fff;color:var(--primary);font-weight:600}

  .view{display:none;padding:16px;animation:fade .25s}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  .card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card-title .emoji{font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--text-light);margin-bottom:5px;font-weight:500}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:#fff;color:var(--text);outline:none;
    transition:border .2s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:64px}

  .row2{display:flex;gap:10px}
  .row2>.field{flex:1}

  /* 开关 */
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
  .switch-row .label{font-size:14px;font-weight:500}
  .switch{
    position:relative;width:48px;height:28px;background:#d1d5db;border-radius:14px;
    cursor:pointer;transition:.25s;flex-shrink:0;
  }
  .switch.on{background:var(--success)}
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
    background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2);
  }
  .switch.on::after{transform:translateX(20px)}

  .btn{
    padding:12px 18px;border-radius:var(--radius-sm);border:none;font-size:15px;
    font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--primary);color:#fff;width:100%}
  .btn-primary:active{background:var(--primary-dark)}
  .btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
  .btn-ghost{background:var(--primary-light);color:var(--primary)}
  .btn-success{background:var(--success);color:#fff}
  .btn-sm{padding:8px 12px;font-size:13px}
  .btn-block{width:100%}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .btn-row>.btn{flex:1;min-width:120px}

  /* 工作记录条目 */
  .record-item{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;
    margin-bottom:10px;background:#fafbfc;position:relative;
  }
  .record-item.is-important{
    border-color:#f59e0b;background:#fffbeb;
    box-shadow:0 0 0 1px rgba(245,158,11,.3);
  }
  .record-item .ri-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .record-item .ri-head-left{display:flex;align-items:center;gap:8px;min-width:0}
  .record-item .ri-num{font-size:12px;color:var(--text-light);font-weight:600}
  .ri-important-toggle{
    display:inline-flex;align-items:center;gap:4px;cursor:pointer;
    font-size:12px;color:var(--text-light);user-select:none;
    padding:3px 8px;border-radius:12px;background:#f3f4f6;transition:.2s;
  }
  .ri-important-toggle.on{
    background:#fef3c7;color:#b45309;font-weight:600;
  }
  .ri-important-toggle .star{font-size:14px}
  .ri-del{
    width:26px;height:26px;border-radius:8px;border:none;background:#fee2e2;color:var(--danger);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .field-mini input{padding:9px 11px;font-size:14px}

  /* 休息日提示 */
  .rest-day-banner{
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    border:1px solid #f59e0b;border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;
    font-size:13px;color:#92400e;
  }
  .rest-day-banner .rest-icon{font-size:22px}
  .rest-day-banner .rest-text{flex:1;line-height:1.5}
  .rest-day-banner .rest-toggle{
    background:#fff;color:#92400e;border:1px solid #f59e0b;
    padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  .rest-day-banner .rest-toggle.on{background:#92400e;color:#fff;border-color:#92400e}

  /* 计划天数与关联任务 */
  .ri-meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .ri-meta-row>.field{flex:1;min-width:80px;margin-bottom:0}
  .ri-plan-days{max-width:90px}
  .ri-plan-days input{padding:8px 10px;font-size:13px;text-align:center}
  .ri-link-sel{flex:2;min-width:160px}
  .ri-link-sel select{padding:8px 10px;font-size:13px}
  .ri-link-info{
    font-size:11px;color:#0e7490;background:#ecfeff;border:1px solid #cffafe;
    padding:4px 8px;border-radius:6px;margin-bottom:6px;line-height:1.5;
  }
  .ri-link-info .chain-tag{font-weight:600}

  /* 甘特图 */
  .gantt-wrap{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
  .gantt-chart{min-width:100%;font-size:11px}
  .gantt-header{display:flex;border-bottom:2px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
  .gantt-task-col{width:120px;min-width:120px;padding:6px 8px;font-weight:600;color:var(--text);border-right:1px solid var(--border);flex-shrink:0;position:sticky;left:0;background:#fff;z-index:2}
  .gantt-day-header{flex:1;min-width:28px;text-align:center;padding:6px 0;color:var(--text-light);border-right:1px solid var(--border)}
  .gantt-day-header.weekend{background:#fef3c7;color:#92400e}
  .gantt-day-header.today{background:var(--primary-light);color:var(--primary);font-weight:600}
  .gantt-row{display:flex;border-bottom:1px solid var(--border);align-items:center;min-height:32px}
  .gantt-row:nth-child(even){background:#fafbfc}
  .gantt-task-name{width:120px;min-width:120px;padding:4px 8px;font-size:11px;color:var(--text);border-right:1px solid var(--border);flex-shrink:0;position:sticky;left:0;background:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
  .gantt-task-name .gantt-star{color:#f59e0b}
  .gantt-cells{flex:1;display:flex;position:relative}
  .gantt-cell{flex:1;min-width:28px;border-right:1px solid #f3f4f6;min-height:32px}
  .gantt-cell.weekend{background:#fffbeb}
  .gantt-bar{
    position:absolute;top:50%;transform:translateY(-50%);
    height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .gantt-bar.done{background:linear-gradient(90deg,#10b981,#059669)}
  .gantt-bar.progress{background:linear-gradient(90deg,#3b82f6,#2563eb)}
  .gantt-bar.late{background:linear-gradient(90deg,#ef4444,#dc2626)}
  .gantt-bar.planned{background:linear-gradient(90deg,#9ca3af,#6b7280)}
  .gantt-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text-light)}
  .gantt-legend-item{display:flex;align-items:center;gap:4px}
  .gantt-legend-dot{width:12px;height:12px;border-radius:3px}
  .gantt-legend-dot.done{background:#10b981}
  .gantt-legend-dot.progress{background:#3b82f6}
  .gantt-legend-dot.late{background:#ef4444}
  .gantt-legend-dot.planned{background:#9ca3af}

  .add-record-btn{
    width:100%;padding:11px;border:1.5px dashed var(--primary);border-radius:var(--radius-sm);
    background:var(--primary-light);color:var(--primary);font-size:14px;font-weight:600;
    cursor:pointer;margin-top:4px;
  }

  /* 外勤卡片 */
  .field-card{border-left:3px solid var(--accent)}

  /* 历史记录列表 */
  .history-item{
    background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;
    box-shadow:var(--shadow);cursor:pointer;transition:.15s;
  }
  .history-item:active{transform:scale(.99)}
  .hi-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .hi-date{font-size:15px;font-weight:600}
  .hi-badges{display:flex;gap:5px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
  .badge-field{background:#cffafe;color:#0e7490}
  .badge-count{background:#e0e7ff;color:#4338ca}
  .hi-preview{font-size:13px;color:var(--text-light);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hi-actions{display:flex;gap:8px;margin-top:8px}
  .hi-actions .btn{flex:1}

  .empty{text-align:center;padding:40px 20px;color:var(--text-light)}
  .empty .emoji{font-size:48px;display:block;margin-bottom:10px}

  /* 报表 */
  .report-block{margin-bottom:18px}
  .report-block h3{font-size:14px;color:var(--text-light);margin-bottom:8px;font-weight:600}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat-box{background:var(--primary-light);border-radius:var(--radius-sm);padding:14px;text-align:center}
  .stat-box .num{font-size:24px;font-weight:700;color:var(--primary)}
  .stat-box .lbl{font-size:12px;color:var(--text-light);margin-top:2px}
  .bar-chart{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .bar-row .bar-lbl{width:60px;color:var(--text-light);flex-shrink:0}
  .bar-track{flex:1;height:22px;background:#f3f4f6;border-radius:6px;overflow:hidden;position:relative}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:6px;transition:width .5s}
  .bar-row .bar-val{width:32px;text-align:right;font-weight:600;flex-shrink:0}

  .report-text{
    background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;
    max-height:320px;overflow-y:auto;
  }
  .summary-card{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid #6ee7b7}
  .summary-card .card-title{color:#065f46}

  /* 设置页 */
  .setting-item{
    display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--border);
  }
  .setting-item:last-child{border-bottom:none}
  .setting-item .si-lbl{font-size:14px}
  .setting-item .si-desc{font-size:12px;color:var(--text-light);margin-top:2px}

  .danger-btn{background:#fee2e2;color:var(--danger);width:100%}

  /* 底部导航 */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:#fff;border-top:1px solid var(--border);
    display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
  }
  .nav-item{
    flex:1;background:none;border:none;cursor:pointer;padding:6px 2px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--text-light);font-size:11px;transition:.15s;
  }
  .nav-item.active{color:var(--primary)}
  .nav-item .nav-icon{font-size:20px}

  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-mask.show{display:flex}
  .modal{
    background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:380px;
    max-height:85vh;overflow-y:auto;animation:pop .2s;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:17px;margin-bottom:14px}
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  .modal-actions .btn{flex:1}

  /* Toast */
  .toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);
    background:rgba(31,41,55,.95);color:#fff;padding:10px 20px;border-radius:24px;
    font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* 日期选择条 */
  .date-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .date-bar input{flex:1}
  .date-bar .nav-arrow{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
    background:#fff;cursor:pointer;font-size:16px;
  }

  @media(min-width:640px){
    .stat-grid{grid-template-columns:repeat(4,1fr)}
    #app{max-width:680px;margin:0 auto}
    .app-header{max-width:680px;margin:0 auto}
    .bottom-nav{max-width:680px;left:50%;transform:translateX(-50%)}
  }
</style>
</head>
<body>

<!-- ===== 锁屏 ===== -->
<div id="lockScreen">
  <div class="lock-logo">📋</div>
  <div class="lock-title">工作周报工具</div>
  <div class="lock-sub">规划与记录每日工作</div>

  <div id="pwdPanel" class="pwd-wrap">
    <input type="password" id="pwdInput" class="pwd-input" placeholder="请输入密码" maxlength="20" inputmode="numeric">
    <button class="btn-unlock" onclick="unlockByPwd()">解 锁</button>
  </div>

  <div id="gesturePanel" style="display:none;flex-direction:column;align-items:center">
    <canvas id="gestureCanvas" width="260" height="260"></canvas>
    <div class="gesture-hint" id="gestureHint">请绘制手势密码</div>
  </div>

  <div class="lock-toggle" id="lockModeToggle" onclick="toggleLockMode()">切换为手势解锁</div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">
  <!-- 顶部 -->
  <div class="app-header">
    <div class="top-row">
      <h1 id="viewTitle">每日记录</h1>
      <div class="header-actions">
        <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
      </div>
    </div>
  </div>

  <!-- 每日记录 -->
  <div class="view active" id="view-daily">
    <div class="date-bar">
      <button class="nav-arrow" onclick="shiftDate(-1)">‹</button>
      <input type="date" id="dailyDate" onchange="loadDaily()">
      <button class="nav-arrow" onclick="shiftDate(1)">›</button>
    </div>

    <div class="rest-day-banner" id="restDayBanner" style="display:none">
      <span class="rest-icon">🌴</span>
      <div class="rest-text" id="restDayText">今日为周末休息日</div>
      <button class="rest-toggle" id="restToggle" onclick="toggleRestDay()">有工作要记录</button>
    </div>

    <div class="card" id="positionHintCard" style="display:none">
      <div class="card-title"><span class="emoji">👤</span>岗位信息未填写</div>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:10px">首次使用请填写岗位信息，填写后无需重复填写。</p>
      <button class="btn btn-outline btn-sm" onclick="switchView('profile');scrollTo(0,0)">前往填写</button>
    </div>

    <div class="card">
      <div class="switch-row">
        <span class="label">🌐 今日外勤</span>
        <div class="switch" id="fieldSwitch" onclick="toggleField()"></div>
      </div>
      <div id="fieldDetail" style="display:none;margin-top:10px">
        <div class="field">
          <label>外勤地点</label>
          <input type="text" id="fieldPlace" placeholder="如：客户公司、外出会议地点">
        </div>
        <div class="field" style="margin-bottom:0">
          <label>外勤事项</label>
          <textarea id="fieldNote" placeholder="外勤工作内容、会见对象等"></textarea>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="emoji">📝</span>工作记录</div>
      <div id="recordList"></div>
      <button class="add-record-btn" onclick="addRecord()">+ 添加一条工作记录</button>
    </div>

    <button class="btn btn-primary" onclick="saveDaily()">💾 保存今日记录</button>
  </div>

  <!-- 岗位信息 -->
  <div class="view" id="view-profile">
    <div class="card">
      <div class="card-title"><span class="emoji">👤</span>岗位信息</div>

<script>
/* ===================== 存储层 ===================== */
const DB = {
  get(key, def){ try{ const v = localStorage.getItem('wr_'+key); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(key, val){ localStorage.setItem('wr_'+key, JSON.stringify(val)); },
  del(key){ localStorage.removeItem('wr_'+key); }
};

/* ===================== Gitee 云端同步 ===================== */
const Cloud = {
  // 配置存储在 localStorage，首次使用预填用户提供的令牌
  cfg: null,
  fileSha: null,           // 云端文件的 SHA，更新时需要
  uploading: false,
  uploadTimer: null,
  lastSyncAt: null,

  loadCfg(){
    if(this.cfg) return this.cfg;
    this.cfg = DB.get('cloudCfg', {
      token: '1c1c9836b1ce948a228cbf14d48364a5',
      owner: 'zhou-shuangxi2026',
      repo: 'weekly-report-data',
      branch: 'master',
      userId: '',           // 使用者用户名，用于数据隔离
      autoSync: true
    });
    return this.cfg;
  },
  saveCfg(c){ this.cfg = c; DB.set('cloudCfg', c); },
  // 数据文件路径：data_{用户名}.json，实现多人数据隔离
  filePath(){
    const c = this.loadCfg();
    const uid = (c.userId||'').trim();
    return uid ? ('data_' + uid + '.json') : 'data.json';
  },
  enabled(){ const c = this.loadCfg(); return !!(c.token && c.owner && c.repo && c.userId); },

  api(method, body){
    const c = this.loadCfg();
    const path = this.filePath();
    const base = 'https://gitee.com/api/v5/repos/' + c.owner + '/' + c.repo + '/contents/' + encodeURIComponent(path);
    let url = base + '?access_token=' + encodeURIComponent(c.token) + '&ref=' + encodeURIComponent(c.branch);
    const opts = { method: method || 'GET', headers: {'Content-Type':'application/json'} };
    if(body){
      body.access_token = c.token;
      body.branch = c.branch;
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  },

  // 收集所有 wr_ 开头的本地数据
  collectAll(){
    const all = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('wr_')===0 && k !== 'wr_cloudCfg'){
        try{ all[k] = JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
    all.__updatedAt = new Date().toISOString();
    all.__device = navigator.userAgent;
    return all;
  },

  // 上传：先获取 SHA（文件存在则更新，不存在则创建）
  upload(msg){
    if(!this.enabled()){ return Promise.reject('未配置云端'); }
    if(this.uploading){ return Promise.resolve('skip'); }
    this.uploading = true;
    const data = this.collectAll();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const message = msg || ('更新工作记录 ' + new Date().toLocaleString('zh-CN'));

    return this.api('GET').then(res => {
      // 文件已存在，更新
      this.fileSha = res.sha;
      return this.api('PUT', { content, message, sha: res.sha });
    }).catch(e => {
      // 文件不存在（404），创建
      return this.api('POST', { content, message });
    }).then(res => {
      this.fileSha = res.content && res.content.sha;
      this.lastSyncAt = new Date();
      this.uploading = false;
      return 'ok';
    }).catch(e => {
      this.uploading = false;
      throw e;
    });
  },

  // 下载：获取云端文件并写入本地（合并策略：云端覆盖本地，但保留本地锁屏配置）
  download(){
    if(!this.enabled()){ return Promise.reject('未配置云端'); }
    return this.api('GET').then(res => {
      this.fileSha = res.sha;
      if(!res.content) throw new Error('云端无数据');
      const json = decodeURIComponent(escape(atob(res.content.replace(/\s/g,''))));
      const data = JSON.parse(json);
      // 保留本地锁屏配置
      const localLock = DB.get('lockCfg', null);
      const localCloud = DB.get('cloudCfg', null);
      // 清空旧数据（保留 cloudCfg 和 lockCfg）
      const keep = {};
      if(localLock) keep['wr_lockCfg'] = JSON.stringify(localLock);
      if(localCloud) keep['wr_cloudCfg'] = JSON.stringify(localCloud);
      Object.keys(localStorage).filter(k => k.indexOf('wr_')===0).forEach(k => {
        if(k !== 'wr_lockCfg' && k !== 'wr_cloudCfg') localStorage.removeItem(k);
      });
      // 写入云端数据
      Object.keys(data).forEach(k => {
        if(k === '__updatedAt' || k === '__device') return;
        if(k === 'wr_lockCfg' && localLock) return; // 不覆盖锁屏
        if(k === 'wr_cloudCfg' && localCloud) return; // 不覆盖配置
        localStorage.setItem(k, JSON.stringify(data[k]));
      });
      this.lastSyncAt = new Date();
      return 'ok';
    });
  },

  // 防抖自动上传
  scheduleUpload(msg){
    if(!this.enabled() || !this.loadCfg().autoSync) return;
    clearTimeout(this.uploadTimer);
    this.uploadTimer = setTimeout(() => {
      this.upload(msg).catch(e => console.warn('自动上传失败:', e.message));
    }, 1500);
  }
};

/* ===================== 全局状态 ===================== */
let state = {
  curDate: todayStr(),
  histFilter: 'all',
  curRecords: [],   // 当日工作记录数组
  curField: false,  // 当日外勤
  fieldPlace:'', fieldNote:'',
  isRestDay: false, // 当日是否为休息日（周六日默认true，可手动覆盖）
  restDayOverridden: false // 是否手动覆盖过休息日状态
};

function todayStr(){ const d=new Date(); return fmtDate(d); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ===================== 锁屏模块 ===================== */
let lockCfg = DB.get('lockCfg', { enabled:false, mode:'password', pwd:'', gesture:'' });

function renderLockScreen(){
  const ls = document.getElementById('lockScreen');
  if(!lockCfg.enabled){
    ls.style.display='none';
    enterApp();
    return;
  }
  ls.style.display='flex';
  const pwdPanel = document.getElementById('pwdPanel');
  const gestPanel = document.getElementById('gesturePanel');
  const toggle = document.getElementById('lockModeToggle');
  if(lockCfg.mode==='gesture' && lockCfg.gesture){
    pwdPanel.style.display='none';
    gestPanel.style.display='flex';
    toggle.style.display='none';
    initGesture();
  }else{
    pwdPanel.style.display='flex';
    gestPanel.style.display='none';
    toggle.style.display = lockCfg.pwd ? 'none' : 'block';
    document.getElementById('pwdInput').focus();
  }
}

function toggleLockMode(){
  // 仅在未设置密码时允许切换体验，实际设置在设置面板
  showToast('请在「设置」中配置解锁方式');
}

function unlockByPwd(){
  const v = document.getElementById('pwdInput').value;
  if(!lockCfg.pwd){
    // 首次未设置密码，直接进入并提示设置
    enterApp();
    showToast('建议在设置中开启密码保护');
    return;
  }
  if(v === lockCfg.pwd){ enterApp(); }
  else{ showToast('密码错误'); shake(document.getElementById('pwdInput')); }
}

function enterApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('bottomNav').style.display='flex';
  initApp();
  // 首次使用：未设置使用者用户名时，自动弹出云端配置
  const c = Cloud.loadCfg();
  if(!c.userId){
    setTimeout(()=>{
      showToast('请先设置使用者用户名');
      openSettings();
      setTimeout(()=>openCloudConfig(), 300);
    }, 400);
    return;
  }
  // 进入应用后自动从云端同步最新数据
  if(Cloud.enabled()){
    Cloud.download().then(()=>{
      showToast('✓ 已从云端同步最新数据');
      initApp(); // 重新加载界面
    }).catch(e=>{
      // 云端无数据或其他错误，静默处理（首次使用正常情况）
      console.log('云端同步跳过:', e.message);
    });
  }
}

function shake(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation='shake .4s'; }
const shakeStyle=document.createElement('style');
shakeStyle.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}';
document.head.appendChild(shakeStyle);

/* ----- 手势解锁 ----- */
let gestPoints=[], gestDrawing=false, gestPath=[];
const GW=260, GCOLS=3, GSIZE=GW/GCOLS;
function initGesture(){
  const c=document.getElementById('gestureCanvas');
  const ctx=c.getContext('2d');
  gestPoints=[];
  for(let r=0;r<3;r++)for(let col=0;col<3;col++)gestPoints.push({x:col*GSIZE+GSIZE/2,y:r*GSIZE+GSIZE/2,idx:r*3+col});
  gestPath=[]; drawGesture(ctx);
  document.getElementById('gestureHint').textContent='请绘制手势密码';
  c.onpointerdown=gestDown; c.onpointermove=gestMove; c.onpointerup=gestUp;
}
function drawGesture(ctx,cur){
  ctx.clearRect(0,0,GW,GW);
  ctx.fillStyle='rgba(255,255,255,.12)';
  gestPoints.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);ctx.fill();});
  if(gestPath.length){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    gestPath.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    if(cur)ctx.lineTo(cur.x,cur.y);
    ctx.stroke();
    ctx.fillStyle='#fff';
    gestPath.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();});
  }
}
function getPos(e){const r=e.target.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitPoint(pt){return gestPoints.find(p=>Math.hypot(p.x-pt.x,p.y-pt.y)<28 && !gestPath.includes(p));}
function gestDown(e){e.preventDefault();gestDrawing=true;gestPath=[];gestMove(e);}
function gestMove(e){
  if(!gestDrawing)return;e.preventDefault();
  const c=document.getElementById('gestureCanvas');const ctx=c.getContext('2d');
  const pos=getPos(e);const hit=hitPoint(pos);
  if(hit){gestPath.push(hit);}
  drawGesture(ctx,pos);
}
function gestUp(e){
  gestDrawing=false;
  const code=gestPath.map(p=>p.idx).join(',');
  const hint=document.getElementById('gestureHint');
  if(!lockCfg.gesture){return;}
  if(code===lockCfg.gesture){
    hint.textContent='✓ 解锁成功';hint.style.color='#6ee7b7';
    setTimeout(enterApp,300);
  }else{
    hint.textContent='手势不正确，请重试';hint.style.color='#fca5a5';
    const c=document.getElementById('gestureCanvas');setTimeout(()=>{gestPath=[];drawGesture(c.getContext('2d'));},400);
  }
}

/* ===================== 设置 ===================== */
function openSettings(){ renderSettings(); document.getElementById('settingsModal').classList.add('show'); }
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }
function renderSettings(){
  document.getElementById('setLockSwitch').classList.toggle('on',lockCfg.enabled);
  document.getElementById('setLockMode').value=lockCfg.mode||'password';
  document.getElementById('setPwdRow').style.display = lockCfg.mode==='password'?'flex':'none';
  document.getElementById('setGestureRow').style.display = lockCfg.mode==='gesture'?'flex':'none';
  // 云端状态
  const st = document.getElementById('cloudSyncStatus');
  const c = Cloud.loadCfg();
  if(c.userId && c.token && c.owner && c.repo){
    const t = Cloud.lastSyncAt ? ('｜上次同步 '+Cloud.lastSyncAt.toLocaleTimeString('zh-CN')) : '';
    st.textContent = '用户：'+c.userId+'｜已连接 '+c.owner+'/'+c.repo + t;
    st.style.color = 'var(--success)';
  }else if(c.token && c.owner && c.repo){
    st.textContent = '未设置使用者用户名，点击配置';
    st.style.color = 'var(--warning)';
  }else{
    st.textContent = '未配置，点击配置开启手机电脑同步';
    st.style.color = 'var(--text-light)';
  }
}

/* ----- 云端同步 ----- */
function openCloudConfig(){
  const c = Cloud.loadCfg();
  document.getElementById('cfgUserId').value = c.userId||'';
  document.getElementById('cfgOwner').value = c.owner||'';
  document.getElementById('cfgRepo').value = c.repo||'';
  document.getElementById('cfgToken').value = c.token||'';
  document.getElementById('cfgBranch').value = c.branch||'master';
  document.getElementById('cfgAutoSync').classList.toggle('on', c.autoSync!==false);
  document.getElementById('cloudTestResult').textContent='';
  document.getElementById('cloudModal').classList.add('show');
}
function closeCloudConfig(){ document.getElementById('cloudModal').classList.remove('show'); }
function saveCloudConfig(){
  const c = {
    userId: document.getElementById('cfgUserId').value.trim(),
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim(),
    branch: document.getElementById('cfgBranch').value.trim()||'master',
    autoSync: document.getElementById('cfgAutoSync').classList.contains('on')
  };
  if(!c.userId){ showToast('请填写使用者用户名'); return; }
  if(!c.owner||!c.repo||!c.token){ showToast('请填写完整 Gitee 配置'); return; }
  Cloud.saveCfg(c);
  closeCloudConfig();
  renderSettings();
  showToast('✓ 云端配置已保存');
}
function cloudSync(action){
  const r = document.getElementById('cloudTestResult');
  r.style.color='var(--text-light)';
  r.textContent = action==='download'?'⏳ 正在从云端拉取...':'⏳ 正在上传到云端...';
  if(action==='download'){
    Cloud.download().then(()=>{
      r.style.color='var(--success)';
      r.textContent='✓ 拉取成功，即将刷新页面';
      showToast('✓ 云端数据已同步');
      setTimeout(()=>location.reload(),1000);
    }).catch(e=>{
      r.style.color='var(--danger)';
      r.textContent='✗ 拉取失败：'+e.message;
    });
  }else{
    Cloud.upload().then(res=>{
      if(res==='skip'){ r.style.color='var(--warning)'; r.textContent='⏸ 上传进行中，请稍候'; return; }
      r.style.color='var(--success)';
      r.textContent='✓ 上传成功 '+new Date().toLocaleTimeString('zh-CN');
      renderSettings();
    }).catch(e=>{
      r.style.color='var(--danger)';

function toggleLockEnabled(){

function changeLockMode(){

/* ===================== 每日记录 ===================== */
function isWeekend(dateStr){
  const d=new Date(dateStr);const w=d.getDay();
  return w===0||w===6; // 0=周日, 6=周六
}
function loadDaily(){
  state.curDate=document.getElementById('dailyDate').value;
  const data=DB.get('daily_'+state.curDate,null);
  const weekend=isWeekend(state.curDate);
  if(data){
    state.curRecords=(data.records||[]).map(r=>Object.assign({isImportant:false,planDays:1,taskId:'',linkedTaskId:''},r));
    state.curField=!!data.field;
    state.fieldPlace=data.fieldPlace||'';
    state.fieldNote=data.fieldNote||'';
    // 休息日状态：已保存的数据优先；若未明确标记则周六日默认休息
    if(data.isRestDay!==undefined){
      state.isRestDay=!!data.isRestDay;
      state.restDayOverridden=true;
    }else{
      // 旧数据：若周末且有实际工作内容，则不视为休息日
      const hasContent=state.curRecords.some(r=>r.plan||r.progress||r.result);
      state.isRestDay=weekend&&!hasContent&&!state.curField;
      state.restDayOverridden=false;
    }
  }else{
    state.curRecords=[{plan:'',progress:'',result:'',isImportant:false,planDays:1,taskId:'',linkedTaskId:''}];
    state.curField=false;state.fieldPlace='';state.fieldNote='';
    // 新日期：周六日默认为休息日
    state.isRestDay=weekend;
    state.restDayOverridden=false;
  }
  // 确保每条记录有 taskId
  state.curRecords.forEach(r=>{ if(!r.taskId) r.taskId='T'+Date.now()+'_'+Math.random().toString(36).substr(2,6); });
  renderRestDayBanner();
  renderFieldSwitch();
  renderRecords();
}

  if(state.isRestDay){

    toggle.textContent='有工作要记录';
    toggle.classList.remove('on');
  }else{

      banner.style.display='flex';
      txt.textContent='今日为周末（'+weekdayCN(state.curDate)+'），已切换为工作记录模式。';
      toggle.textContent='恢复为休息日';
      toggle.classList.add('on');

/* 获取近期未完成任务（进度未达100%） */
function getRecentUndoneTasks(days,beforeDate){
  const result=[];
  const keys=Object.keys(localStorage).filter(k=>k.startsWith(DB.prefix+'daily_'));
  keys.sort().reverse();
  for(const key of keys){
    const dateStr=key.replace(DB.prefix+'daily_','');
    if(dateStr>=beforeDate)continue; // 仅取当日之前的
    const diff=Math.round((new Date(beforeDate)-new Date(dateStr))/86400000);
    if(diff>days)break;
    const data=DB.get('daily_'+dateStr,null);
    if(!data||data.isRestDay)continue;
    (data.records||[]).forEach(r=>{
      if(!r.plan)return;
      const done=r.progress&&(r.progress.includes('100')||/已完成/.test(r.progress));
      if(!done){
        result.push({date:dateStr,plan:r.plan,progress:r.progress,taskId:r.taskId||'',isImportant:!!r.isImportant});
      }
    });
  }
  return result.slice(0,20); // 最多20条
}

/* ===================== 周报 ===================== */
function getWeekRange(dateStr){
  const d=new Date(dateStr);const day=d.getDay()||7;
  const mon=new Date(d);mon.setDate(d.getDate()-day+1);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return {start:fmtDate(mon),end:fmtDate(sun),mon,sun};
}
function renderWeekly(){
  const wp=document.getElementById('weekPicker');
  if(!wp.value){
    const r=getWeekRange(todayStr());
    wp.value=r.start.slice(0,4)+'-W'+getWeekNum(r.mon);
  }
  const wk=wp.value; // YYYY-Www
  const [y,w]=wk.split('-W');
  const mon=mondayOfISOWeek(parseInt(y),parseInt(w));
  const start=fmtDate(mon);const end=fmtDate(new Date(mon.getTime()+6*86400000));
  const all=getAllRecords();
  const weekData=all.filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('weeklyContent').innerHTML=buildWeeklyHTML(start,end,weekData);
}
function getWeekNum(d){
  const t=new Date(d);t.setHours(0,0,0,0);
  t.setDate(t.getDate()+4-(t.getDay()||7));
  const yearStart=new Date(t.getFullYear(),0,1);
  return Math.ceil(((t-yearStart)/86400000+1)/7);
}
function mondayOfISOWeek(y,w){
  const simple=new Date(y,0,1+(w-1)*7);
  const dow=simple.getDay();const off=(dow<=4)?dow-1:dow-8;
  simple.setDate(simple.getDate()-off);
  simple.setHours(0,0,0,0);
  return simple;
}
function shiftWeek(n){
  const wp=document.getElementById('weekPicker');
  const [y,w]=wp.value.split('-W');
  let nw=parseInt(w)+n,ny=parseInt(y);
  if(nw<1){ny--;nw=52;}
  if(nw>52){ny++;nw=1;}
  wp.value=ny+'-W'+String(nw).padStart(2,'0');
  renderWeekly();
}

  let html=`

    ${data.map(r=>{

      return `
      <div class="bar-row">

function generateAnalysis(days,records,field,rate,data,crossDayTasks){
  let tips=[];
  if(days===0)tips.push('本周尚未记录工作内容，建议养成每日记录习惯。');
  else{
    if(records/days>4)tips.push('工作量较大（日均'+(records/days).toFixed(1)+'项），注意合理分配精力。');
    else if(records/days<1.5)tips.push('工作量偏少，可考虑承接更多任务或细化记录。');
    else tips.push('工作量适中，节奏合理。');
    if(rate>=80)tips.push('任务链完成率'+rate+'%（按任务最终状态统计），执行力强，继续保持。');
    else if(rate<50)tips.push('任务链完成率仅'+rate+'%，需关注未完成任务，分析是否需要调整计划天数或拆分任务。');
    else tips.push('任务链完成率'+rate+'%，部分任务仍在推进中。');
    if(field>2)tips.push('外勤'+field+'天较多，注意外勤与内勤工作的平衡。');
    if(crossDayTasks&&crossDayTasks.length>0){
      const overdue=crossDayTasks.filter(c=>c.isOverdue);
      const noReason=crossDayTasks.filter(c=>!c.hasReason);
      tips.push('本周有'+crossDayTasks.length+'项跨天任务'+(overdue.length?'，其中'+overdue.length+'项超期':'')+(noReason.length?'，'+noReason.length+'项未注明延续原因':'')+'。');
    }
    // 找最忙的一天
    const peak=data.reduce((a,b)=>((b.records||[]).length>(a.records||[]).length?b:a),data[0]);
    if(peak)tips.push(peak.date+'工作量最高，可作为节奏参考。');
  }
  return tips.map(t=>'• '+t).join('<br>');
}

function shiftMonth(n){

/* 工作分类：根据关键词判断工作类型 */
function classifyWork(plan,result){
  const txt=(plan||'')+' '+(result||'');
  const cats=[];
  if(/采购|投标|招标|供应商|食材|项目|竞标|报价|合同|采购项目|大宗/.test(txt))cats.push('采购投标');
  if(/搜索|筛选|收集|整理|信息|调研|查|查找|浏览|企查查|销邦|乙方宝/.test(txt))cats.push('信息收集调研');
  if(/文档|资料|归档|报告|总结|整理|录入|上传|编写|撰写|制作/.test(txt))cats.push('文档资料处理');
  if(/会议|沟通|对接|讨论|汇报|确认|联系|协调|跟进|代总/.test(txt))cats.push('沟通协调汇报');
  if(/外勤|出差|外出|考察|现场|拜访|对接/.test(txt))cats.push('外勤出差');
  if(/AI|工具|智能|归档整理|处理|分析|系统|软件/.test(txt))cats.push('工具与技术应用');
  if(cats.length===0)cats.push('其他工作');
  return cats[0];
}
/* 生成工作分类统计 */
function buildCategoryStats(data){
  const stats={};
  data.forEach(r=>{
    (r.records||[]).forEach(x=>{
      if(!x.plan&&!x.progress&&!x.result)return;
      const cat=classifyWork(x.plan,x.result);
      if(!stats[cat])stats[cat]={count:0,done:0,important:0,items:[]};
      stats[cat].count++;
      if(x.progress&&(x.progress.includes('完成')||x.progress.includes('100')))stats[cat].done++;
      if(x.isImportant)stats[cat].important++;
      stats[cat].items.push({date:r.date,plan:x.plan,progress:x.progress,result:x.result,field:r.field,isImportant:!!x.isImportant});
    });
  });
  return stats;
}

function extractProblems(data){

/* ===================== 任务链追踪与完成率判定 ===================== */
/* 判断单条记录是否已完成 */
function isRecordDone(r){
  return !!(r.progress&&(r.progress.includes('100')||/已完成/.test(r.progress)));
}
/* 构建任务链：通过 linkedTaskId 关联，将跨天记录串联成任务链 */
function buildTaskChains(data){
  // 1. 扁平化所有记录
  const allItems=[];
  data.forEach(d=>{
    (d.records||[]).forEach(r=>{
      if(!r.plan&&!r.progress&&!r.result)return;
      allItems.push({
        date:d.date,plan:r.plan,progress:r.progress,result:r.result,
        isImportant:!!r.isImportant,planDays:r.planDays||1,
        taskId:r.taskId||'',linkedTaskId:r.linkedTaskId||'',
        isRestDay:d.isRestDay===true
      });
    });
  });
  // 2. 建立 taskId -> item 映射
  const taskMap={};
  allItems.forEach(it=>{ if(it.taskId)taskMap[it.taskId]=it; });
  // 3. 通过 linkedTaskId 构建链
  const chains=[];
  const visited={};
  allItems.forEach(it=>{
    if(visited[it.taskId])return;
    // 向前追溯链头
    let head=it;
    while(head.linkedTaskId&&taskMap[head.linkedTaskId]&&!visited[taskMap[head.linkedTaskId].taskId]){
      head=taskMap[head.linkedTaskId];
    }
    // 从链头向后收集整条链
    const chain=[];
    let cur=head;
    while(cur&&!visited[cur.taskId]){
      visited[cur.taskId]=true;
      chain.push(cur);
      // 找下一个：谁的 linkedTaskId 等于当前 taskId
      const next=allItems.find(x=>x.linkedTaskId===cur.taskId&&!visited[x.taskId]);
      cur=next||null;
    }
    if(chain.length>0){
      const startDate=chain[0].date;
      const endDate=chain[chain.length-1].date;
      const spanDays=Math.round((new Date(endDate)-new Date(startDate))/86400000)+1;
      const lastDone=isRecordDone(chain[chain.length-1]);
      const anyDone=chain.some(isRecordDone);
      const totalPlanDays=chain.reduce((s,c)=>s+(c.planDays||1),0);
      chains.push({
        items:chain,
        startDate:startDate,endDate:endDate,
        spanDays:spanDays,
        planDays:totalPlanDays,
        isDone:lastDone,            // 以链尾状态为准
        isOverdue:spanDays>totalPlanDays, // 实际天数超过计划天数
        isCrossDay:chain.length>1,
        hasReason:chainHasReason(chain),
        mainPlan:chain[0].plan||chain[chain.length-1].plan||'',
        isImportant:chain.some(c=>c.isImportant)
      });
    }
  });
  return chains;
}
/* 检查任务链各节点是否写明了延续原因 */
function chainHasReason(chain){
  if(chain.length<=1)return true; // 单日任务无需说明
  // 检查非首日的记录是否包含原因说明关键词
  const reasonKeywords=/因为|由于|原因|继续|延续|昨天|前天|上次|尚未|未完成|还需|接下来|接着|今日继续|推进|等待|对方|确认|协调|补充|修改|完善|调整|问题|困难|卡/;
  for(let i=1;i<chain.length;i++){
    const txt=((chain[i].plan||'')+' '+(chain[i].result||'')+' '+(chain[i].progress||'')).trim();
    if(reasonKeywords.test(txt))return true;
  }
  return false;
}
/* 基于任务链重新计算完成率（周期内最终完成状态） */
function calcChainCompleteRate(chains){
  if(chains.length===0)return 0;
  const doneCount=chains.filter(c=>c.isDone).length;
  return Math.round(doneCount/chains.length*100);
}
/* 提取跨天延续任务（用于延续原因分析） */
function extractCrossDayTasks(chains){
  return chains.filter(c=>c.isCrossDay).sort((a,b)=>b.spanDays-a.spanDays);
}
/* 工作关联分析：识别工作主线、推进脉络与因果链 */
function analyzeWorkLinkage(data,importantRecords){
  // 1. 按工作分类聚类，找出贯穿全月的主线
  const catTimeline={};
  data.forEach(r=>{
    (r.records||[]).forEach(x=>{
      if(!x.plan&&!x.result)return;
      const cat=classifyWork(x.plan,x.result);
      if(!catTimeline[cat])catTimeline[cat]={dates:[],items:[],firstDate:r.date,lastDate:r.date};
      catTimeline[cat].dates.push(r.date);
      catTimeline[cat].items.push({date:r.date,plan:x.plan,result:x.result,progress:x.progress,isImportant:!!x.isImportant});
      if(r.date<catTimeline[cat].firstDate)catTimeline[cat].firstDate=r.date;
      if(r.date>catTimeline[cat].lastDate)catTimeline[cat].lastDate=r.date;
    });
  });
  // 2. 识别"主线"：跨多天、有持续推进的工作类别
  const mainlines=Object.keys(catTimeline).map(cat=>{
    const t=catTimeline[cat];
    const uniqDates=[...new Set(t.dates)];
    return {
      category:cat,
      dateCount:uniqDates.length,
      itemCount:t.items.length,
      firstDate:t.firstDate,lastDate:t.lastDate,
      items:t.items,
      span:Math.round((new Date(t.lastDate)-new Date(t.firstDate))/86400000)+1
    };
  }).filter(m=>m.dateCount>=2||m.itemCount>=3).sort((a,b)=>b.dateCount-a.dateCount||b.itemCount-a.itemCount);

  // 3. 因果链：寻找同一类别中"先调研→后行动→再交付"的推进模式
  const causalChains=[];
  mainlines.forEach(m=>{
    const items=m.items.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const phases={调研:[],行动:[],交付:[]};
    items.forEach(it=>{
      const txt=(it.plan||'')+(it.result||'')+(it.progress||'');
      if(/搜索|筛选|收集|整理|调研|查|查找|浏览|了解|分析/.test(txt))phases.调研.push(it);
      else if(/完成|交付|归档|报告|总结|制作|编写|撰写|签订|中标|成交/.test(txt))phases.交付.push(it);
      else phases.行动.push(it);
    });
    if(phases.调研.length&&phases.交付.length){
      causalChains.push({
        category:m.category,
        research:phases.调研,
        action:phases.行动,
        delivery:phases.交付,
        span:m.span
      });
    }
  });

  // 4. 重要任务的推进脉络
  const importantTrace=importantRecords.map(it=>{
    const done=it.progress&&(it.progress.includes('完成')||it.progress.includes('100'));
    return {date:it.date,plan:it.plan,result:it.result,done,week:it.week};
  });

  return {catTimeline,mainlines,causalChains,importantTrace};
}
/* 生成下一步工作方向指导 */
function generateDirectionGuidance(data,linkage,importantRecords,problems,catStats,crossDayTasks){
  const guidance=[];
  // 0. 基于跨天延续任务分析
  if(crossDayTasks&&crossDayTasks.length>0){
    const overdue=crossDayTasks.filter(c=>c.isOverdue);
    const noReason=crossDayTasks.filter(c=>!c.hasReason);
    const undone=crossDayTasks.filter(c=>!c.isDone);
    if(undone.length>0){
      guidance.push('【未结任务】以下 '+undone.length+' 项跨天任务在周期内仍未完成：');
      undone.slice(0,3).forEach(c=>{
        guidance.push('  · '+c.startDate+'~'+c.endDate+'（'+c.spanDays+'天）：'+(c.mainPlan||'').substring(0,35));
      });
      guidance.push('  建议下月优先收尾，并分析延期根因。');
    }
    if(overdue.length>0){
      guidance.push('【超期警示】'+overdue.length+' 项任务实际耗时超过计划天数，建议：');
      guidance.push('  · 评估计划天数设定是否合理，适当增加缓冲；');
      guidance.push('  · 对频繁超期的任务类型，拆分为更小粒度便于跟踪。');
    }
    if(noReason.length>0){
      guidance.push('【记录规范】'+noReason.length+' 项跨天任务未写明延续原因，建议：');
      guidance.push('  · 续做任务时务必在"工作成果/备注"中注明为何延续（如等待对方回复、需补充资料等）；');
      guidance.push('  · 关联前序任务时同步填写当日进展与阻塞点。');
    }
  }
  // 1. 基于未完成的重要任务
  const undoneImportant=importantRecords.filter(it=>!(it.progress&&(it.progress.includes('完成')||it.progress.includes('100'))));
  if(undoneImportant.length>0){
    guidance.push('【重点跟进】以下 '+undoneImportant.length+' 项重要任务尚未完成，下月应作为首要推进事项：');
    undoneImportant.slice(0,5).forEach(it=>{
      guidance.push('  · '+it.date+'：'+(it.plan||'').substring(0,40)+(it.plan&&it.plan.length>40?'...':''));
    });
  }
  // 2. 基于工作主线延续
  if(linkage.mainlines.length>0){
    const top=linkage.mainlines[0];
    guidance.push('【主线延续】「'+top.category+'」类工作贯穿 '+top.firstDate+' 至 '+top.lastDate+'，累计 '+top.itemCount+' 项，是该岗位的核心职责方向，下月应持续投入并优化流程。');
  }
  // 3. 基于因果链建议
  if(linkage.causalChains.length>0){
    guidance.push('【推进脉络】识别到工作存在"调研→行动→交付"的推进链条，建议下月：');
    guidance.push('  · 对调研类工作前置安排，为后续行动留出时间；');
    guidance.push('  · 对交付类工作建立节点跟踪，避免临近月底集中冲刺。');
  }
  // 4. 基于问题建议
  if(problems.length>0){
    guidance.push('【问题改进】本月识别到 '+problems.length+' 项待改进事项，建议下月：');
    guidance.push('  · 针对重复出现的问题，建立标准化应对流程；');
    guidance.push('  · 对外勤/采购类阻塞事项，提前与对方确认时间表。');
  }
  // 5. 基于工作分布失衡建议
  if(catStats){
    const cats=Object.keys(catStats).sort((a,b)=>catStats[b].count-catStats[a].count);
    if(cats.length>=2){
      const top=cats[0],bottom=cats[cats.length-1];
      const topCnt=catStats[top].count,bottomCnt=catStats[bottom].count;
      if(topCnt>bottomCnt*3){
        guidance.push('【结构优化】工作高度集中在「'+top+'」类（'+topCnt+' 项），而「'+bottom+'」类偏少（'+bottomCnt+' 项），建议下月适当平衡各类工作，避免单一方向过度倾斜。');
      }
    }
  }
  // 6. 通用建议
  if(guidance.length===0){
    guidance.push('【常规推进】本月工作整体平稳，建议下月继续保持现有节奏，同时主动寻找可优化点，提升工作产出质量。');
  }
  return guidance;
}
/* 构建跨天延续分析文本（用于报告正文） */
function buildCrossDayAnalysisText(crossDayTasks){
  if(!crossDayTasks||crossDayTasks.length===0){
    return '本周期内未识别到跨天延续任务，工作多为当日完成，节奏紧凑。';
  }
  let text='共识别到 '+crossDayTasks.length+' 项跨天延续任务：\n';
  crossDayTasks.forEach((c,i)=>{
    text+='  '+(i+1)+'. 「'+(c.mainPlan||'').substring(0,30)+'」\n';
    text+='     · 时间跨度：'+c.startDate+' 至 '+c.endDate+'（'+c.spanDays+'天，计划 '+c.planDays+' 天）';
    text+=c.isOverdue?' [超期]':' [按计划]';
    text+=c.isDone?' [已完成]':' [未完成]';
    text+='\n';
    if(!c.hasReason){
      text+='     · ⚠ 延续原因未注明：记录人在续做时未写明为何延续，建议补充说明。\n';
    }else{
      text+='     · 延续原因已记录。\n';
    }
  });
  return text;
}
/* ===================== 甘特图渲染 ===================== */
/* 构建甘特图HTML */
function buildGanttHTML(chains,periodStart,periodEnd){
  if(!chains||chains.length===0){
    return '<div style="font-size:13px;color:var(--text-light);text-align:center;padding:16px">暂无任务数据</div>';
  }
  // 生成日期序列
  const days=[];
  const start=new Date(periodStart),end=new Date(periodEnd);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    days.push(d.toISOString().slice(0,10));
  }
  const totalDays=days.length;
  // 每天宽度百分比
  const dayWidth=100/totalDays;
  const todayStr=new Date().toISOString().slice(0,10);
  // 表头
  let html='<div class="gantt-wrap"><div class="gantt-chart">';
  html+='<div class="gantt-header"><div class="gantt-task-col">任务名称</div>';
  days.forEach(d=>{
    const wd=new Date(d).getDay();
    const isWk=(wd===0||wd===6);
    const isToday=(d===todayStr);
    html+='<div class="gantt-day-header'+(isWk?' weekend':'')+(isToday?' today':'')+'">'+d.slice(8)+'</div>';
  });
  html+='</div>';
  // 任务行（最多显示15条，优先重要任务和跨天任务）
  const sortedChains=chains.slice().sort((a,b)=>{
    if(a.isImportant!==b.isImportant)return a.isImportant?-1:1;
    if(a.isCrossDay!==b.isCrossDay)return a.isCrossDay?-1:1;
    return a.startDate.localeCompare(b.startDate);
  }).slice(0,15);
  sortedChains.forEach(c=>{
    const startIdx=Math.max(0,days.indexOf(c.startDate));
    const endIdx=Math.min(totalDays-1,Math.max(startIdx,days.indexOf(c.endDate)));
    const barStart=startIdx*dayWidth;
    const barWidth=Math.max(dayWidth,(endIdx-startIdx+1)*dayWidth);
    let barClass='planned';
    let barText='';
    if(c.isDone){barClass='done';barText='✓';}
    else if(c.isOverdue){barClass='late';barText='超期';}
    else if(c.isCrossDay){barClass='progress';barText=c.spanDays+'天';}
    const star=c.isImportant?'<span class="gantt-star">★</span>':'';
    html+='<div class="gantt-row">';
    html+='<div class="gantt-task-name" title="'+esc(c.mainPlan)+'">'+star+esc((c.mainPlan||'').substring(0,12))+'</div>';
    html+='<div class="gantt-cells">';
    // 绘制单元格背景
    days.forEach(d=>{
      const wd=new Date(d).getDay();
      const isWk=(wd===0||wd===6);
      html+='<div class="gantt-cell'+(isWk?' weekend':'')+'"></div>';
    });
    // 绘制任务条
    html+='<div class="gantt-bar '+barClass+'" style="left:'+barStart+'%;width:'+barWidth+'%" title="'+esc(c.startDate)+'~'+esc(c.endDate)+' '+(c.isDone?'已完成':c.isOverdue?'超期':'进行中')+'">'+barText+'</div>';
    html+='</div></div>';
  });
  html+='</div>';
  // 图例
  html+='<div class="gantt-legend">';
  html+='<div class="gantt-legend-item"><span class="gantt-legend-dot done"></span>已完成</div>';
  html+='<div class="gantt-legend-item"><span class="gantt-legend-dot progress"></span>进行中</div>';
  html+='<div class="gantt-legend-item"><span class="gantt-legend-dot late"></span>超期</div>';
  html+='<div class="gantt-legend-item"><span class="gantt-legend-dot planned"></span>计划中</div>';
  html+='</div></div>';
  return html;
}

function buildMonthlyHTML(ym,data){
  const pf=DB.get('profile',{});
  const totalDays=data.length;
  const fieldDays=data.filter(r=>r.field).length;
  const restDays=data.filter(r=>r.isRestDay===true).length;
  const workDays=totalDays-restDays;
  let totalRecords=0;
  let importantCount=0;
  const weekStats={};
  const allRecords=[]; // 扁平化所有工作记录
  data.forEach(r=>{
    const recs=(r.records||[]).filter(x=>x.plan||x.progress||x.result);
    const c=recs.length;
    totalRecords+=c;
    importantCount+=recs.filter(x=>x.isImportant).length;
    const wk=getWeekNum(new Date(r.date));
    if(!weekStats[wk])weekStats[wk]={days:0,records:0,items:[],important:0};
    weekStats[wk].days++;weekStats[wk].records+=c;
    weekStats[wk].important+=recs.filter(x=>x.isImportant).length;
    recs.forEach(x=>{
      allRecords.push({date:r.date,week:wk,plan:x.plan,progress:x.progress,result:x.result,field:r.field,isImportant:!!x.isImportant,isRestDay:r.isRestDay===true});
    });
  });
  const maxWk=Math.max(1,...Object.values(weekStats).map(s=>s.records));
  const completed=data.flatMap(r=>(r.records||[]).filter(x=>x.progress&&(x.progress.includes('完成')||x.progress.includes('100'))));
  const completeRate=totalRecords?Math.round(completed.length/totalRecords*100):0;
  const inProgress=totalRecords-completed.length;
  const catStats=buildCategoryStats(data);
  const problems=extractProblems(data);
  const fieldRecords=data.filter(r=>r.field).map(r=>({date:r.date,place:r.fieldPlace,note:r.fieldNote,records:r.records}));
  const importantRecords=extractImportantRecords(data);
  const linkage=analyzeWorkLinkage(data,importantRecords);
  // 任务链分析
  const chains=buildTaskChains(data);
  const crossDayTasks=extractCrossDayTasks(chains);
  const chainCompleteRate=calcChainCompleteRate(chains);
  const chainDoneCount=chains.filter(c=>c.isDone).length;
  const chainUndoneCount=chains.length-chainDoneCount;
  const directionGuidance=generateDirectionGuidance(data,linkage,importantRecords,problems,catStats,crossDayTasks);
  const catNames=Object.keys(catStats).sort((a,b)=>catStats[b].count-catStats[a].count);

  let html=`
  <div class="card">
    <div class="card-title"><span class="emoji">📈</span>月报概览</div>

    <div class="stat-grid">
      <div class="stat-box"><div class="num">${totalDays}</div><div class="lbl">记录天数</div></div>
      <div class="stat-box"><div class="num">${totalRecords}</div><div class="lbl">工作条数</div></div>
      <div class="stat-box"><div class="num" style="color:#b45309">${importantCount}</div><div class="lbl">重要任务</div></div>
      <div class="stat-box"><div class="num">${completeRate}%</div><div class="lbl">完成率</div></div>
    </div>
    <h3>各周工作量</h3>
    <div class="bar-chart">
    ${Object.keys(weekStats).sort((a,b)=>a-b).map(wk=>`
      <div class="bar-row">
        <span class="bar-lbl">第${wk}周</span>
        <div class="bar-track"><div class="bar-fill" style="width:${weekStats[wk].records/maxWk*100}%"></div></div>
        <span class="bar-val">${weekStats[wk].records}</span>
      </div>`).join('')||'<div style="font-size:13px;color:var(--text-light)">本月暂无记录</div>'}
    </div>
  </div>`;

  // ========== 月报正文（重点任务突出 + 普通任务简化 + 关联分析 + 方向指导） ==========
  let text=`月 度 工 作 总 结 报 告\n${'='.repeat(38)}\n`;
  text+=`姓名：${pf.name||'-'}    部门：${pf.dept||'-'}    岗位：${pf.position||'-'}\n`;
  text+=`报告月份：${ym}    报告日期：${todayStr()}\n\n`;

  // 一、月度工作概况
  text+=`一、月度工作概况\n${'-'.repeat(38)}\n`;

  if(crossDayTasks.length>0){

  // 三、普通工作概览（按周简化展示，不逐条罗列）

        ${it.result?`<div style="color:#666;margin-top:2px">成果：${esc(it.result)}</div>`:''}
      </div>`;
    }).join('')}

  </div>`;

  // 工作关联分析卡片

    <div class="card-title" style="color:#0e7490"><span class="emoji">🔗</span>工作关联分析</div>

    html+=`<div class="card">
    <div class="card-title"><span class="emoji">📅</span>任务甘特图</div>
    ${buildGanttHTML(chains,monthStart,monthEnd)}
    </div>`;
  }

  // 跨天延续分析卡片
  if(crossDayTasks.length>0){
    html+=`<div class="card" style="border-left:4px solid #f59e0b">
    <div class="card-title" style="color:#b45309"><span class="emoji">⏳</span>跨天延续任务分析（${crossDayTasks.length} 项）</div>
    <div style="font-size:13px;line-height:1.7">
    ${crossDayTasks.map(c=>{
      const statusColor=c.isDone?'#10b981':(c.isOverdue?'#ef4444':'#3b82f6');
      const statusText=c.isDone?'已完成':(c.isOverdue?'超期':'进行中');
      return `<div style="margin-bottom:8px;padding:8px;background:#fffbeb;border-radius:8px">
        <div style="font-weight:600;color:#92400e">${c.isImportant?'★ ':''}${esc((c.mainPlan||'').substring(0,30))}</div>
        <div style="font-size:12px;color:#666;margin-top:3px">${c.startDate} ~ ${c.endDate}（${c.spanDays}天，计划${c.planDays}天）<span style="color:${statusColor};font-weight:600"> ${statusText}</span></div>
        ${!c.hasReason?'<div style="font-size:11px;color:#ef4444;margin-top:3px">⚠ 延续原因未注明，建议补充说明为何延续</div>':'<div style="font-size:11px;color:#10b981;margin-top:3px">✓ 延续原因已记录</div>'}
      </div>`;
    }).join('')}
    </div>
  </div>`;
  }

  // 下一步方向指导卡片
  html+=`<div class="card" style="border-left:4px solid var(--success);background:linear-gradient(135deg,#ecfdf5,#d1fae5)">
    <div class="card-title" style="color:#065f46"><span class="emoji">🧭</span>下一步工作方向指导</div>
    <div style="font-size:13px;line-height:1.8">
      ${directionGuidance.map(g=>'<div style="margin-bottom:6px">'+esc(g)+'</div>').join('')}
    </div>
  </div>`;

  html+=`
  <div class="card summary-card">
    <div class="card-title"><span class="emoji">💡</span>月度智能分析</div>
    <div style="font-size:13px;line-height:1.7">
      ${generateMonthAnalysis(totalDays,totalRecords,fieldDays,chainCompleteRate,weekStats,catStats,problems,importantCount,crossDayTasks)}
    </div>
  </div>`;

  // 工作分类卡片
  if(catNames.length>0){
    html+=`<div class="card">
    <div class="card-title"><span class="emoji">🗂️</span>工作分类统计</div>
    <div class="stat-grid">
    ${catNames.map(cat=>{
      const s=catStats[cat];
      const rate=s.count?Math.round(s.done/s.count*100):0;
      return `<div class="stat-box"><div class="num" style="font-size:20px">${s.count}</div><div class="lbl" style="font-size:12px">${cat}<br>完成率 ${rate}%${s.important?` · 重要 ${s.important}`:''}</div></div>`;
    }).join('')}
    </div>
  </div>`;
  }

  html+=`
  <div class="card">
    <div class="card-title"><span class="emoji">📝</span>下月计划</div>
    <div class="field" style="margin-bottom:10px">
      <textarea id="monthlyPlanInput" placeholder="请填写下月重点工作规划，每行一项..." style="min-height:110px">${esc(savedMonthPlan)}</textarea>
    </div>
    <button class="btn btn-primary" onclick="saveMonthlyPlan('${monthKey}')">💾 保存下月计划</button>
  </div>
  <div class="btn-row" style="margin-bottom:14px">
    <button class="btn btn-success" onclick="exportReport('monthly','csv')">📊 导出甘特图</button>
    <button class="btn btn-primary" onclick="exportReport('monthly','doc')">📄 导出文档</button>
  </div>`;
  return html;
}
function buildLinkageHTML(linkage){
  if(linkage.mainlines.length===0){
    return '<div style="color:var(--text-light)">本月工作较为分散，暂未识别出明显的工作主线。建议后续加强工作的连贯性与项目化推进。</div>';
  }
  let html='<div style="margin-bottom:12px"><strong>工作主线：</strong></div>';
  linkage.mainlines.slice(0,3).forEach((m,i)=>{
    html+=`<div style="margin-bottom:6px">• 「${esc(m.category)}」贯穿 ${m.firstDate} 至 ${m.lastDate}（${m.span} 天），${m.itemCount} 项，${m.dateCount} 个工作日</div>`;
  });
  if(linkage.causalChains.length>0){
    html+='<div style="margin:12px 0 8px"><strong>推进脉络（调研→行动→交付）：</strong></div>';
    linkage.causalChains.slice(0,2).forEach((c,i)=>{
      html+=`<div style="margin-bottom:8px;padding:8px;background:#f0f9ff;border-radius:8px">`;
      html+=`<div style="font-weight:600;color:#0e7490">「${esc(c.category)}」</div>`;
      if(c.research.length>0)html+=`<div style="font-size:12px;color:#666;margin-top:3px">调研期：${c.research.length} 项（${c.research[0].date} 起）</div>`;
      if(c.action.length>0)html+=`<div style="font-size:12px;color:#666">行动期：${c.action.length} 项</div>`;
      if(c.delivery.length>0)html+=`<div style="font-size:12px;color:#666">交付期：${c.delivery.length} 项（${c.delivery[c.delivery.length-1].date} 止）</div>`;
      html+=`</div>`;
    });
  }
  if(linkage.importantTrace.length>0){
    html+='<div style="margin:12px 0 8px"><strong>重点任务推进：</strong></div>';
    linkage.importantTrace.slice(0,6).forEach(it=>{
      const dot=it.done?'✓':'○';
      html+=`<div style="font-size:12px;color:#666;margin-bottom:3px">${dot} ${it.date}：${esc((it.plan||'').substring(0,30))}${it.done?' <span style="color:#10b981">已完成</span>':' <span style="color:#f59e0b">进行中</span>'}</div>`;
    });
  }
  return html;
}

function generateMonthAnalysis(days,records,field,rate,weeks,catStats,problems,importantCount,crossDayTasks){
  importantCount=importantCount||0;
  let tips=[];
  if(days===0)tips.push('本月尚未记录工作内容。');
  else{
    const avg=records/days;
    tips.push('日均工作量 '+avg.toFixed(1)+' 项，共 '+Object.keys(weeks).length+' 周有记录。');
    if(importantCount>0){
      const impRate=records?Math.round(importantCount/records*100):0;
      tips.push('重要任务 '+importantCount+' 项，占比 '+impRate+'%，工作重点突出。');
    }else{
      tips.push('本月未标记重要任务，建议日常记录时标注关键工作以便月报重点呈现。');
    }
    if(rate>=80)tips.push('任务链完成率 '+rate+'%（按任务最终状态统计），整体执行情况良好。');
    else if(rate>=60)tips.push('任务链完成率 '+rate+'%，部分任务仍在推进，需关注后续进展。');
    else tips.push('任务链完成率 '+rate+'%，较多任务未在月内完成，建议复盘延期原因。');
    if(crossDayTasks&&crossDayTasks.length>0){
      const overdue=crossDayTasks.filter(c=>c.isOverdue);
      const noReason=crossDayTasks.filter(c=>!c.hasReason);
      const undone=crossDayTasks.filter(c=>!c.isDone);
      let tip='跨天任务 '+crossDayTasks.length+' 项';
      if(overdue.length>0)tip+='，超期 '+overdue.length+' 项';
      if(noReason.length>0)tip+='，'+noReason.length+' 项未注明延续原因';
      if(undone.length>0)tip+='，'+undone.length+' 项未完成';
      tips.push(tip+'，建议关注任务计划天数设定的合理性。');
    }
    // 最忙的周
    let busyWk='',busyCnt=0;
    for(const w in weeks){if(weeks[w].records>busyCnt){busyCnt=weeks[w].records;busyWk=w;}}
    if(busyWk)tips.push('第 '+busyWk+' 周工作量最大（'+busyCnt+' 项），可分析高峰原因并提前规划。');
    if(field>5)tips.push('外勤较多（'+field+' 天），建议提前统筹路线与资料，提升外出效率。');
    // 工作分布
    if(catStats){
      const cats=Object.keys(catStats).sort((a,b)=>catStats[b].count-catStats[a].count);
      if(cats.length>0){
        const top=cats[0];
        tips.push('主要工作集中在「'+top+'」类（'+catStats[top].count+' 项），占据本月核心精力。');
      }
      if(cats.length>=3)tips.push('工作覆盖面广（'+cats.length+' 类），综合能力持续锻炼。');
    }
    // 问题提示
    if(problems&&problems.length>0){
      tips.push('识别到 '+problems.length+' 条待改进事项，建议重点关注并形成改进措施。');
    }
  }
  return tips.map(t=>'• '+t).join('<br>');
}

/* ===================== 导出功能 ===================== */
function exportReport(type,fmt){
  let data,text,prefix,periodStart,periodEnd;
  if(type==='weekly'){
    const wp=document.getElementById('weekPicker').value;
    const [y,w]=wp.split('-W');
    const mon=mondayOfISOWeek(parseInt(y),parseInt(w));
    const start=fmtDate(mon);const end=fmtDate(new Date(mon.getTime()+6*86400000));
    data=getAllRecords().filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
    prefix='周报_'+start+'_'+end;
    periodStart=start;periodEnd=end;
    let weeklyText=document.querySelector('#weeklyContent .report-text').textContent;
    const planInput=document.getElementById('weeklyPlanInput');
    if(planInput){
      const pv=planInput.value.trim();
      weeklyText=weeklyText.replace(/五、下周计划\n[\s\S]*$/,'五、下周计划\n'+(pv||'（请补充下周重点工作安排）'));
    }
    text=weeklyText;
  }else{
    const ym=document.getElementById('monthPicker').value;
    const [y,m]=ym.split('-').map(Number);
    const start=ym+'-01';const end=ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    data=getAllRecords().filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
    prefix='月报_'+ym;
    periodStart=start;periodEnd=end;
    let monthlyText=document.querySelector('#monthlyContent .report-text').textContent;
    const planInput=document.getElementById('monthlyPlanInput');
    if(planInput){
      const pv=planInput.value.trim();
      // 兼容新结构（十、下月工作计划）、过渡结构（八、下月工作计划）和旧结构（五、下月计划）
      if(/十、下月工作计划/.test(monthlyText)){
        monthlyText=monthlyText.replace(/十、下月工作计划\n[\s\S]*$/,'十、下月工作计划\n--------------------------------------\n'+(pv||'（请在下月计划输入区填写重点工作规划）'));
      }else if(/八、下月工作计划/.test(monthlyText)){
        monthlyText=monthlyText.replace(/八、下月工作计划\n[\s\S]*$/,'八、下月工作计划\n--------------------------------------\n'+(pv||'（请在下月计划输入区填写重点工作规划）'));
      }else{
        monthlyText=monthlyText.replace(/五、下月计划\n[\s\S]*$/,'五、下月计划\n'+(pv||'（请补充下月重点工作规划）'));
      }
    }
    text=monthlyText;
  }
  if(fmt==='csv')downloadGantt(data,prefix,periodStart,periodEnd);
  else downloadDOC(text,prefix);
}
/* 导出甘特图（HTML表格，可用Excel打开） */
function downloadGantt(data,prefix,periodStart,periodEnd){
  const pf=DB.get('profile',{});
  const chains=buildTaskChains(data);
  if(chains.length===0){showToast('暂无任务数据，无法导出甘特图');return;}
  // 生成日期序列
  const days=[];
  const start=new Date(periodStart),end=new Date(periodEnd);
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    days.push(d.toISOString().slice(0,10));
  }
  // 构建HTML甘特图表格
  let html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(prefix)+'_甘特图</title>';
  html+='<style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px}h2{text-align:center;margin-bottom:5px}.info{text-align:center;color:#666;margin-bottom:15px;font-size:13px}';
  html+='table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #ccc;padding:4px 6px;text-align:center;white-space:nowrap}';
  html+='th{background:#4f46e5;color:#fff;position:sticky;top:0}th.weekend{background:#92400e}td.weekend{background:#fef3c7}';
  html+='td.task-name{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:140px;max-width:220px;overflow:hidden;text-overflow:ellipsis}';
  html+='td.bar-done{background:#10b981;color:#fff;font-weight:600}td.bar-progress{background:#3b82f6;color:#fff;font-weight:600}';
  html+='td.bar-late{background:#ef4444;color:#fff;font-weight:600}td.bar-planned{background:#9ca3af;color:#fff;font-weight:600}';
  html+='td.empty{background:#fafafa}.legend{margin-top:15px;font-size:12px;color:#666}.legend span{display:inline-block;margin-right:15px;padding:3px 8px;border-radius:3px;color:#fff;font-weight:600}';
  html+='table.detail{margin-top:20px}table.detail th{background:#6b7280}table.detail td{text-align:left}';
  html+='</style></head><body>';
  html+='<h2>任务甘特图</h2>';
  html+='<div class="info">姓名：'+esc(pf.name||'-')+'　部门：'+esc(pf.dept||'-')+'　周期：'+periodStart+' 至 '+periodEnd+'　导出日期：'+todayStr()+'</div>';
  // 甘特图表格
  html+='<table><thead><tr><th>任务名称</th>';
  days.forEach(d=>{
    const wd=new Date(d).getDay();
    const isWk=(wd===0||wd===6);
    html+='<th class="'+(isWk?'weekend':'')+'">'+d.slice(5).replace('-','/')+'</th>';
  });
  html+='</tr></thead><tbody>';
  // 排序：重要任务优先，跨天任务优先，按开始日期
  const sortedChains=chains.slice().sort((a,b)=>{
    if(a.isImportant!==b.isImportant)return a.isImportant?-1:1;
    if(a.isCrossDay!==b.isCrossDay)return a.isCrossDay?-1:1;
    return a.startDate.localeCompare(b.startDate);
  });
  sortedChains.forEach(c=>{
    const startIdx=Math.max(0,days.indexOf(c.startDate));
    const endIdx=Math.min(days.length-1,Math.max(startIdx,days.indexOf(c.endDate)));
    html+='<tr><td class="task-name">'+(c.isImportant?'★ ':'')+esc(c.mainPlan||'').substring(0,30)+'</td>';
    days.forEach((d,idx)=>{
      const wd=new Date(d).getDay();
      const isWk=(wd===0||wd===6);
      if(idx>=startIdx&&idx<=endIdx){
        let barClass='bar-planned',barText='';
        if(c.isDone){barClass='bar-done';barText='✓';}
        else if(c.isOverdue){barClass='bar-late';barText='超期';}
        else if(c.isCrossDay){barClass='bar-progress';barText=c.spanDays+'天';}
        html+='<td class="'+barClass+'">'+barText+'</td>';
      }else{
        html+='<td class="'+(isWk?'weekend':'empty')+'"></td>';
      }
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  // 图例
  html+='<div class="legend"><span class="bar-done">已完成</span><span class="bar-progress">进行中</span><span class="bar-late">超期</span><span class="bar-planned">计划中</span></div>';
  // 任务详情表
  html+='<table class="detail"><thead><tr><th>序号</th><th>任务名称</th><th>开始日期</th><th>结束日期</th><th>实际天数</th><th>计划天数</th><th>状态</th><th>重要</th><th>跨天</th><th>超期</th><th>延续原因</th></tr></thead><tbody>';
  sortedChains.forEach((c,i)=>{
    const status=c.isDone?'已完成':(c.isOverdue?'超期':'进行中');
    html+='<tr>';
    html+='<td>'+(i+1)+'</td>';
    html+='<td>'+esc(c.mainPlan||'').substring(0,40)+'</td>';
    html+='<td>'+c.startDate+'</td>';
    html+='<td>'+c.endDate+'</td>';
    html+='<td>'+c.spanDays+'</td>';
    html+='<td>'+c.planDays+'</td>';
    html+='<td>'+status+'</td>';
    html+='<td>'+(c.isImportant?'★':'')+'</td>';
    html+='<td>'+(c.isCrossDay?'是':'否')+'</td>';
    html+='<td>'+(c.isOverdue?'是':'否')+'</td>';
    html+='<td>'+(c.isCrossDay?(c.hasReason?'已注明':'⚠未注明'):'-')+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  html+='</body></html>';
  const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'});
  triggerDownload(blob,prefix+'_甘特图.xls');
  showToast('✓ 已导出 '+prefix+'_甘特图.xls');
}
function downloadCSV(data,prefix){
  const pf=DB.get('profile',{});
  let rows=[];
  rows.push(['工作周报记录表']);
  rows.push(['姓名',pf.name||'','部门',pf.dept||'','岗位',pf.position||'']);
  rows.push(['日期','星期','是否休息日','是否外勤','外勤地点','外勤事项','是否重要任务','计划天数','是否关联任务','工作计划/内容','完成进度','工作成果/备注']);
  data.forEach(r=>{
    const isRest=r.isRestDay===true;
    const recs=(r.records||[]).filter(x=>x.plan||x.progress||x.result);
    if(recs.length===0){
      // 仅休息日记录
      rows.push([r.date,weekdayCN(r.date),isRest?'是':'否',r.field?'是':'否',r.fieldPlace||'',r.fieldNote||'','','','','休息日','',isRest?'休息日':'']);
    }else{
      recs.forEach(x=>{
        rows.push([r.date,weekdayCN(r.date),isRest?'是':'否',r.field?'是':'否',r.fieldPlace||'',r.fieldNote||'',x.isImportant?'★重要':'',x.planDays||1,x.linkedTaskId?'续':''  ,x.plan||'',x.progress||'',x.result||'']);
      });
    }
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  triggerDownload(blob,prefix+'.csv');
  showToast('✓ 已导出 '+prefix+'.csv');
}
function downloadDOC(text,prefix){
  const pf=DB.get('profile',{});
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${prefix}</title>
  <style>body{font-family:'宋体',SimSun,serif;font-size:14px;line-height:1.8;padding:40px}
  h1{text-align:center;font-size:20px}table{border-collapse:collapse;width:100%;margin:10px 0}
  td,th{border:1px solid #999;padding:6px;font-size:12px}</style></head>
  <body><pre style="white-space:pre-wrap;font-family:inherit">${esc(text)}</pre></body></html>`;
  const blob=new Blob(['\ufeff',html],{type:'application/msword'});
  triggerDownload(blob,prefix+'.doc');
  showToast('✓ 已导出 '+prefix+'.doc');
}
function triggerDownload(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(a.href);},100);
}
function exportAllCSV(){
  const data=getAllRecords();
  if(data.length===0){showToast('暂无数据可导出');return;}
  downloadCSV(data,'全部工作记录_'+todayStr());
}

/* ===================== Toast ===================== */
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ===================== 启动 ===================== */
window.addEventListener('DOMContentLoaded',()=>{
  renderLockScreen();
  document.getElementById('pwdInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlockByPwd();});
  // 点击遮罩关闭弹窗
  document.getElementById('settingsModal').addEventListener('click',e=>{
    if(e.target.id==='settingsModal')closeSettings();
  });
  document.getElementById('cloudModal').addEventListener('click',e=>{
    if(e.target.id==='cloudModal')closeCloudConfig();
  });
});
</script>
